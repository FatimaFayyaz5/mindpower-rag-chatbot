<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Power Artists - Fun Chatbot!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        body {
            background-color: #fce4ec; /* Pastel pink */
            background-image: radial-gradient(#f8bbd0 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-container {
            width: 95%;
            max-width: 500px;
            height: 85vh;
            background: #ffffff;
            border: 6px solid #ff80ab;
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(255, 128, 171, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .header {
            background: #ff80ab;
            padding: 20px;
            text-align: center;
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1px;
            border-bottom: 6px solid #f50057;
            text-shadow: 2px 2px 0px #f50057;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #fafafa;
        }

        /* Scrollbar styling */
        .chat-box::-webkit-scrollbar { width: 8px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: #ff80ab; border-radius: 4px; }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .user-row {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            border: 4px solid;
            background: white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            flex-shrink: 0;
            z-index: 2;
        }

        .bot-avatar {
            border-color: #81d4fa; /* Pastel blue */
            background: #e1f5fe;
        }

        .user-avatar {
            border-color: #ffd54f; /* Pastel yellow */
            background: #fff8e1;
        }

        .bubble {
            max-width: 65%;
            padding: 14px 20px;
            border-radius: 25px;
            font-size: 1rem;
            line-height: 1.5;
            font-weight: 700;
            position: relative;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .bot-bubble {
            background: #e1f5fe;
            color: #0277bd;
            border: 3px solid #81d4fa;
            border-bottom-left-radius: 5px;
        }

        .user-bubble {
            background: #fff8e1;
            color: #f57f17;
            border: 3px solid #ffd54f;
            border-bottom-right-radius: 5px;
        }

        .source-tag {
            display: inline-block;
            background: #ff80ab;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 900;
            margin-top: 8px;
            box-shadow: 0 2px 0 #f50057;
        }

        .typing {
            display: none;
            margin-left: 70px;
            font-style: italic;
            color: #ff80ab;
            font-weight: 700;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .input-area {
            padding: 20px;
            background: #ffffff;
            border-top: 6px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        input[type="text"].chat-input {
            flex: 1;
            padding: 15px;
            border: 4px solid #e0e0e0;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 700;
            color: #424242;
            transition: border-color 0.2s;
        }

        input[type="text"].chat-input:focus {
            border-color: #81d4fa;
        }

        button.send-btn {
            background: #81d4fa;
            color: #01579b;
            border: none;
            border-bottom: 5px solid #29b6f6;
            padding: 0 25px;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 900;
            transition: all 0.1s;
        }

        button.send-btn:active {
            transform: translateY(5px);
            border-bottom: 0px;
            margin-top: 5px;
        }

        /* Settings Modal */
        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s;
        }
        .settings-btn:hover { transform: rotate(45deg); }

        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 25px;
            width: 80%;
            border: 6px solid #ffd54f;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-content h3 {
            margin-top: 0;
            color: #f57f17;
            font-size: 1.8rem;
            font-weight: 900;
        }

        .modal-content p {
            color: #757575;
            font-weight: 700;
            line-height: 1.4;
        }

        .modal-content input {
            width: 90%;
            padding: 12px;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            font-family: inherit;
            font-weight: 700;
            margin-bottom: 20px;
            outline: none;
        }
        .modal-content input:focus { border-color: #ffd54f; }

        .modal-content button {
            background: #ffd54f;
            color: #f57f17;
            border: none;
            border-bottom: 4px solid #ffca28;
            padding: 12px 30px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: 900;
            cursor: pointer;
        }
        .modal-content button:active {
            transform: translateY(4px);
            border-bottom: 0px;
            margin-top: 4px;
        }

    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            ✨ Mind Power AI ✨
            <button class="settings-btn" onclick="toggleModal()">⚙️</button>
        </div>
        
        <div class="chat-box" id="chat-box">
            <div class="message-row">
                <div class="avatar bot-avatar">🧠</div>
                <div class="bubble bot-bubble">Hi! I am the Mind Power Artists assistant! Ask me anything about our healing services, courses, or bookings!</div>
            </div>
        </div>
        
        <div class="typing" id="typing-indicator">Brainstorming an answer... 💭</div>
        
        <div class="input-area">
            <input type="text" class="chat-input" id="user-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>

        <div class="modal" id="settings-modal">
            <div class="modal-content">
                <h3>Settings</h3>
                <p>To make the AI extra smart, paste a free Groq API key here. Without a key, I will use my built-in offline brain!</p>
                <input type="text" id="api-key" placeholder="gsk_...">
                <button onclick="saveSettings()">Save & Play!</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. The Embedded Knowledge Base ---
        const kb = [
            {"category": "About", "question": "What is Mind Power Artists?", "answer": "Mind Power Artists is a holistic platform offering healing and mind transformation programs. It combines modern psychology with ancient Sufi wisdom to reprogram the subconscious mind for success, health, and peace."},
            {"category": "About", "question": "Where is Mind Power Artists located?", "answer": "Mind Power Artists is located at The Plazzo, Below Askari Bank, Gulberg Greens, Islamabad, Pakistan. They also have a USA office at 1209 Mountain Road PL NE #7837, Albuquerque, NM 87110."},
            {"category": "About", "question": "How can I contact Mind Power Artists?", "answer": "You can contact Mind Power Artists via: Pakistan Phone: +92 310 333 8452, USA Phone: +1 505 532 5323, Email: info@mindpowerartists.com."},
            {"category": "Services", "question": "What services does Mind Power Artists offer?", "answer": "Mind Power Artists offers services including: Aura Cleansing, Hypnotherapy, Behavioral Transformation, Business Energy Boost, Disease Healing, Relationship Therapy, Hormonal Imbalance Treatment, Fertility Enhancement, and more."},
            {"category": "Services", "question": "What is Aura Cleansing?", "answer": "Aura Cleansing removes negative energies, blockages and evil eye from your aura. It heals mind and body and boosts aura for enhanced luck using powerful energy healing techniques."},
            {"category": "Services", "question": "What is Hypnotherapy at Mind Power Artists?", "answer": "Hypnotherapy provides fast relief from past life traumas, present stresses, and emotional blockages. It helps you access your subconscious mind to release stress and anxiety, and rewire your thoughts for success."},
            {"category": "Services", "question": "What is the Business Boost Service?", "answer": "The Business Boost Service provides regular Aura Energy enhancement to instantly boost your business and luck. Sales are increased by Energy Boosting and Telepathic Marketing."},
            {"category": "Courses", "question": "What courses does Mind Power Artists offer?", "answer": "Mind Power Artists offers courses: Professional Hypnotherapy, Sufi Mind Control 10X Silva, Telepathy, Weight Loss Through Hypnotherapy, Aura Energy Activation, and Money Manifestation."},
            {"category": "Payment", "question": "What are the payment options?", "answer": "Mind Power Artists accepts bank transfers and cash payments only. All payments are required in advance to confirm your booking and reserve your spot."},
            {"category": "Booking", "question": "How can I book an appointment or join a session?", "answer": "You can book an appointment through the Mind Power Artists website at mindpowerartists.com/book-an-appointment. Both online and in-person options are available."},
            {"category": "Cancellation", "question": "How can I cancel a session?", "answer": "Cancellations are accepted up to 48 hours before the scheduled healing or session. Requests after this period are not eligible for refund."},
            {"category": "General", "question": "What kind of results should I expect?", "answer": "Most participants notice improvement in focus, emotional calm, and confidence within a few sessions. Outcomes depend on commitment and regular practice."}
        ];

        // --- 2. TF-IDF / Keyword Search Engine (JavaScript version) ---
        const stopwords = new Set(["what", "is", "the", "a", "an", "do", "does", "how", "can", "i", "you", "my", "of", "and", "in", "to", "for", "with", "on", "at", "are", "it"]);
        
        function tokenize(text) {
            let tokens = text.toLowerCase().match(/[a-z0-9]+/g) || [];
            return tokens.filter(t => !stopwords.has(t));
        }

        function searchKB(query) {
            const qTokens = tokenize(query);
            if (qTokens.length === 0) return [];
            
            let scored = kb.map(entry => {
                let eTokens = tokenize(entry.question + " " + entry.answer);
                let score = 0;
                qTokens.forEach(qt => {
                    if (eTokens.includes(qt)) score += 1;
                });
                // Bonus if words appear in sequence
                if(entry.question.toLowerCase().includes(query.toLowerCase())) score += 2;
                return { entry, score: score / Math.max(1, qTokens.length) };
            });
            
            scored.sort((a, b) => b.score - a.score);
            return scored.filter(s => s.score > 0.1).slice(0, 3);
        }

        // --- 3. UI Logic ---
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const typingIndicator = document.getElementById("typing-indicator");
        
        let groqApiKey = localStorage.getItem("mpa_api_key") || "";
        document.getElementById("api-key").value = groqApiKey;

        function toggleModal() {
            const modal = document.getElementById("settings-modal");
            modal.style.display = modal.style.display === "flex" ? "none" : "flex";
        }

        function saveSettings() {
            groqApiKey = document.getElementById("api-key").value.trim();
            localStorage.setItem("mpa_api_key", groqApiKey);
            toggleModal();
        }

        function handleEnter(e) {
            if (e.key === "Enter") sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Add User Message
            appendMessage("user", text);
            userInput.value = "";
            
            // Show typing indicator
            typingIndicator.style.display = "block";
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Perform Retrieval
            const results = searchKB(text);
            
            // Simulate natural delay
            await new Promise(r => setTimeout(r, 800));

            // 3. Generate Answer
            if (groqApiKey && results.length > 0) {
                // Cloud API Generation Mode
                try {
                    let contextText = results.map(r => `Q: ${r.entry.question}\nA: ${r.entry.answer}`).join("\n\n");
                    const prompt = `You are a fun, friendly, and magical AI assistant for Mind Power Artists. 
Answer the user using ONLY this info. Keep it short and use emojis! 
If not in the info, say you don't know and to email info@mindpowerartists.com.

--- INFO ---
${contextText}
--- END ---

User: ${text}
Answer:`;

                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${groqApiKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "llama-3.1-8b-instant",
                            messages: [{role: "user", content: prompt}],
                            temperature: 0.4,
                            max_tokens: 300
                        })
                    });

                    if(!response.ok) throw new Error("API failed");
                    const data = await response.json();
                    
                    typingIndicator.style.display = "none";
                    appendMessage("bot", data.choices[0].message.content, results[0].entry.category);
                    
                } catch(e) {
                    // Fallback if API fails
                    typingIndicator.style.display = "none";
                    appendMessage("bot", "Oops! My magical cloud connection failed. 🌩️ Here is what I found in my offline brain:\n\n" + results[0].entry.answer, results[0].entry.category);
                }
            } else {
                // Offline Fallback Mode
                typingIndicator.style.display = "none";
                if (results.length > 0) {
                    appendMessage("bot", "✨ " + results[0].entry.answer, results[0].entry.category);
                } else {
                    appendMessage("bot", "I don't have that information right now! Please email us at info@mindpowerartists.com. 💌");
                }
            }
        }

        function appendMessage(sender, text, sourceCategory = null) {
            const row = document.createElement("div");
            row.className = `message-row ${sender === 'user' ? 'user-row' : ''}`;
            
            const avatar = document.createElement("div");
            avatar.className = `avatar ${sender === 'user' ? 'user-avatar' : 'bot-avatar'}`;
            avatar.innerText = sender === 'user' ? '👤' : '🧠';
            
            const bubble = document.createElement("div");
            bubble.className = `bubble ${sender === 'user' ? 'user-bubble' : 'bot-bubble'}`;
            
            // Convert newlines to breaks
            let formattedText = text.replace(/\n/g, '<br>');
            bubble.innerHTML = formattedText;

            if (sourceCategory && sender === 'bot') {
                const sourceTag = document.createElement("div");
                sourceTag.className = "source-tag";
                sourceTag.innerText = "Source: " + sourceCategory;
                bubble.appendChild(document.createElement("br"));
                bubble.appendChild(sourceTag);
            }

            row.appendChild(avatar);
            row.appendChild(bubble);
            
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
